# Legacy URL redirects for lastshift.lib.unb.ca. Until the Kubernetes 1.37 rebuild these were an
# ingress-nginx server-snippet in kubernetes-metadata; the Envoy Gateway that replaces
# ingress-nginx runs no snippets, so the image serves them itself. The base image includes
# this file inside its server block, ahead of `location /`.
#
# Relative Location headers: TLS ends at the Gateway and nginx here sees plain HTTP, so an
# absolute Location would name http:// and cost every visitor a second redirect.
absolute_redirect off;

location = /index.html { return 301 /; }
location = /comments.html        { return 301 /comments; }
location = /contact.html         { return 301 /contact; }
location = /credits.html         { return 301 /credits; }
location = /images.html          { return 301 /images; }
location = /links.html           { return 301 /links; }
location = /order.html           { return 301 /order; }
location = /post-screening.html  { return 301 /post-screening; }
location = /reading.html         { return 301 /reading; }
location = /the-project.html     { return 301 /the-project; }
location = /trailer.html         { return 301 /trailer; }
location ~ ^/assets/images/(.+)$ { return 301 /images/$1; }
